# PPM Configuration File

# Manage Homebrew behavior on macOS
HOMEBREW_NO_AUTO_UPDATE=1
HOMEBREW_NO_ENV_HINTS=1

# Duration in seconds between brew formula updates (default: 24 hours)
HOMEBREW_UPDATE_CACHE_DURATION=86400

# Duration in seconds between ppm repo updates (default: 24 hours)
PPM_UPDATE_CACHE_DURATION=86400

# `ppm install` prints "Not updated (uncommitted changes): <repos>" for source repos it can't
# pull because they have local changes. Uncomment to show that only with --debug.
#PPM_QUIET_SKIPPED_REPOS=true
